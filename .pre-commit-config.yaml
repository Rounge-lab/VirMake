default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^docs/
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(src/virmake/workflow|docs)/
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^(src/virmake/workflow|docs)/
      - id: trailing-whitespace
        exclude: ^(src/virmake/workflow|docs)/
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: pixi run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: test
        entry: pixi run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
