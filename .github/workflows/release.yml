name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: "Version to release (e.g. 1.1.0)", required: true }
permissions:
  contents: write
jobs:
  guard:
    name: main-only release policy
    runs-on: ubuntu-latest
    steps:
      - name: Releases may only be dispatched from main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Release dispatched from '${{ github.ref_name }}' - releases are main-only."
          exit 1
  checks:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with: { cache: true }
      - run: pixi run test
      - run: pixi run smoke
  release:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with: { cache: true }
      - name: Assert version matches source and tag is new
        run: |
          pixi run python -c "import sys, virmake; assert virmake.__version__ == sys.argv[1], (virmake.__version__, sys.argv[1])" "${{ inputs.version }}"
          ! git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1
      - run: pixi run build
      - id: sha
        run: echo "sha256=$(sha256sum dist/virmake-${{ inputs.version }}.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: GitHub release (sdist + wheel attached)
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --title "v${{ inputs.version }}" --generate-notes \
            --notes "sha256 (sdist): ${{ steps.sha.outputs.sha256 }}"
        env: { GH_TOKEN: "${{ github.token }}" }
  bioconda:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # virmake repo: provides patch_recipe.py
      - uses: actions/checkout@v4
        with:
          repository: Rounge-lab/bioconda-recipes
          ref: master
          path: bioconda-recipes         # public fork: clone needs no token
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Configure push access (deploy key)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BIOCONDA_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cd bioconda-recipes
          git remote set-url origin git@github.com:Rounge-lab/bioconda-recipes.git
      - name: Patch recipe and push branch (if recipe exists)
        working-directory: bioconda-recipes
        run: |
          if [ ! -f recipes/virmake/meta.yaml ]; then
            echo "Recipe does not exist yet - initial PR is manual."; exit 0
          fi
          python "${GITHUB_WORKSPACE}/.github/scripts/patch_recipe.py" \
            recipes/virmake/meta.yaml --version "${{ inputs.version }}" \
            --sha256 "${{ needs.release.outputs.sha256 }}"
          BRANCH="virmake_${{ inputs.version }}"
          git checkout -b "$BRANCH"
          git config user.name "VirMake release bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "virmake v${{ inputs.version }}"
          git push origin "$BRANCH"
          echo "Branch pushed. Open the bioconda PR here (one click):"
          python - "$BRANCH" <<'EOF'
          import sys
          from urllib.parse import quote
          branch = sys.argv[1]
          version = branch.split("_", 1)[1]
          print(f"https://github.com/bioconda/bioconda-recipes/compare/master..."
                f"Rounge-lab:bioconda-recipes:{branch}?quick_pull=1"
                f"&title={quote(f'virmake: v{version}')}"
                f"&body={quote(f'Automated version bump for virmake v{version}. '
                              f'sha256 (sdist): verified in the VirMake release notes.')}")
          EOF
