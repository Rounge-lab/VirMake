<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 1400"
  width="100%"
  role="img"
  aria-labelledby="VirMake workflow overview"
>
  <title id="workflow-title">VirMake workflow overview</title>
  <desc id="workflow-description">Diagram of the VirMake pipeline: quality control, assembly, viral
        identification, dereplication, mapping, taxonomy and functional
        annotation, ending in the summary tables.</desc>
  <style>
    /*
      These fallbacks make the SVG usable by itself.
      When inline in an HTML document, the variables defined on :root
      or html[data-theme="dark"] will be inherited and take precedence.
    */
    svg {
      --crc-background: #f6f7fa;
      --crc-border: #dee2e6;
      --crc-muted: #6c757d;
      --crc-primary: #67a0b1;
      --crc-surface: #ffffff;
      --crc-tertiary: #6b519d;
      --crc-text: #212529;

      color: var(--crc-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .viewbox-boundary {
      fill: none;
      stroke: var(--crc-primary);
      stroke-width: 1;
      stroke-dasharray: 5 4;
      pointer-events: none;
    }

    .connector {
      fill: none;
      stroke: var(--crc-primary);
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }

    .node rect {
      fill: none;
      stroke-width: 2;
    }

    .node text {
      fill: var(--crc-text);
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /*
      Input nodes:
      --crc-tertiary outline and standard rounded corners.
    */
    .node--input rect {
      stroke: var(--crc-tertiary);
    }

    /*
      Optional nodes:
      Same tertiary colour, distinguished by dashed outline.
    */
    .node--optional rect {
      stroke: var(--crc-tertiary);
      stroke-dasharray: 7 5;
    }

    /*
      Tool nodes:
      --crc-muted outline.
    */
    .node--tool rect {
      stroke: var(--crc-muted);
    }

    /*
      Generated data:
      --crc-primary outline and a smaller corner radius.
    */
    .node--generated rect {
      stroke: var(--crc-primary);
    }

    .node--generated .node-input-frame {
      fill: none;
      stroke: var(--crc-tertiary);
      stroke-width: 2;
    }

    /*
      Cluster Title
    */
    .node--cluster rect {
      stroke: none;
      fill: var(--crc-border);
    }

    .cluster-boundary {
      fill: none;
      stroke: var(--crc-border);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      pointer-events: none;
    }

  </style>

  <defs>
    <marker
      id="arrowhead"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="7"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path
        d="M 0 0
           L 10 5
           L 0 10
           Q 3 5 0 0
           Z"
        fill="var(--crc-primary)"
      />
    </marker>
  </defs>

  <!-- Connectors: placed before nodes so they render underneath. -->

  <!-- Nodes -->
  <g class="node node--cluster">
    <rect x="10" y="120" width="100" height="30" rx="14" ry="14"/>
    <text x="60" y="136">PLACEHOLDER</text>
  </g>

  <!-- Visual debugging boundary for viewBox="0 0 980 430" -->
  <rect
    class="viewbox-boundary"
    x="0.5"
    y="0.5"
    width="979"
    height="1398"
  />
</svg>
